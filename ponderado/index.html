<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ponderado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora Ponderada</h1>
        <div class="input-group">
            <label>Nota 1 (40%):</label>
            <input type="number" id="nota1" step="0.1" min="0" max="20">
        </div>
        <div class="input-group">
            <label>Nota 2 (40%):</label>
            <input type="number" id="nota2" step="0.1" min="0" max="20">
        </div>
        <div class="input-group">
            <label>Nota 3 (20%):</label>
            <input type="number" id="nota3" step="0.1" min="0" max="20">
        </div>
        <button onclick="calcular()">Calcular Promedio</button>
        <h2 id="resultado">Resultado: -</h2>
    </div>
    <script src="script.js"></script>
</body>
</html>
