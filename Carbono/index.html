<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Huella de Carbono</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <header>
            <h1>Huella Ecológica</h1>
            <p>Calcula tu impacto ambiental mensual</p>
        </header>
        
        <div class="inputs">
            <div class="field">
                <label>Consumo Eléctrico (kWh)</label>
                <input type="number" id="kwh" placeholder="ej. 150" min="0">
            </div>
        </div>

        <button onclick="calcularHuella()">Calcular Impacto</button>

        <div id="resultado" class="result-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
