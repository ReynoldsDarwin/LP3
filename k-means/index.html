<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Agrupamiento K-Means</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simulador K-Means</h1>
        
        <div class="canvas-container">
            <canvas id="kmeansCanvas" width="800" height="450"></canvas>
        </div>

        <div class="panel">
            <div class="control-group">
                <label for="clusterCount">Número de Clusters (K)</label>
                <input type="number" id="clusterCount" min="2" max="6" value="3">
            </div>
            <div class="control-group">
                <label for="pointCount">Cantidad de Puntos</label>
                <input type="number" id="pointCount" min="10" max="300" value="100">
            </div>
        </div>

        <div class="metrics">
            <div class="card">
                <div class="card-label">Iteración Actual</div>
                <div id="iterationCount" class="card-value gold-text">0</div>
            </div>
            <div class="card">
                <div class="card-label">Estado del Algoritmo</div>
                <div id="algoStatus" class="card-value neon-text">No Inicializado</div>
            </div>
        </div>

        <div class="controls">
            <button id="btnGenerate" class="btn-secondary">Generar Puntos</button>
            <button id="btnInit" class="btn-secondary">Iniciar Centroides</button>
            <button id="btnStep" class="btn-primary" disabled>Siguiente Paso</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
