<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz en Rombo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="controls">
        <label for="charInput">Signo:</label>
        <input type="text" id="charInput" maxlength="1" value="♦">
        
        <label for="sizeInput">Dimensión (Impar):</label>
        <input type="number" id="sizeInput" min="3" max="21" step="2" value="7">
        
        <button id="generateBtn">Generar Matriz</button>
    </div>

    <div class="matrix-container" id="matrixDisplay">
        </div>

    <script src="script.js"></script>
</body>
</html>
