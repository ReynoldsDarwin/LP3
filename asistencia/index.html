<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro DATA FEST - UNAP</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <script type="module" src="app.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>DATA FEST</h1>
            <h2>Universidad Nacional del Altiplano</h2>
            <h3>Facultad de Ingeniería Estadística e Informática</h3>
        </div>
    </header>

    <main>
        <section class="card">
            <h3>Registro de Asistencia</h3>
            <form id="registroForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="ejemplo@unap.edu.pe" required>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de Asistente:</label>
                    <select id="tipo" required>
                        <option value="">-- Seleccione una opción --</option>
                        <option value="Estudiante">Estudiante</option>
                        <option value="Ponente">Ponente</option>
                        <option value="Investigador">Investigador</option>
                        <option value="Organizador">Organizador</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Registrar Asistencia</button>
            </form>

            <div id="certificadoArea" class="hidden">
                <p>¡Registro exitoso!</p>
                <button id="btnCertificado" class="btn-success">Descargar mi Certificado (PDF)</button>
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <h3>Listado de Asistentes</h3>
                <button id="btnDescargarLista" class="btn-secondary">Exportar Lista (PDF)</button>
            </div>
            
            <div class="table-container">
                <table id="tablaAsistentes">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Tipo</th>
                        </tr>
                    </thead>
                    <tbody id="listaCuerpo">
                        </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
