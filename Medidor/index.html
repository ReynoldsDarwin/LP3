<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Consumo Eléctrico</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de Consumo</h1>
        <p>Ingresa los datos de tu artefacto para evaluar su eficiencia.</p>
        
        <div class="form-group">
            <label for="producto">Producto / Artefacto:</label>
            <input type="text" id="producto" placeholder="Ej: Refrigeradora, TV, Laptop">
        </div>

        <div class="form-group">
            <label for="watts">Potencia (Watts):</label>
            <input type="number" id="watts" placeholder="Ingresa los Watts (W)">
        </div>

        <div class="form-group">
            <label for="horas">Horas de uso al día:</label>
            <input type="number" id="horas" placeholder="Ej: 5" step="0.5">
        </div>

        <button onclick="calcularConsumo()">Calcular Consumo</button>

        <div id="resultado" class="result-card" style="display: none;">
            <h3 id="res-producto"></h3>
            <p>Consumo Diario: <span id="res-kwh"></span> kWh</p>
            <div id="res-categoria" class="badge"></div>
        </div>
    </div>
    <script src="/scripts/script.js"></script>
</body>
</html>
