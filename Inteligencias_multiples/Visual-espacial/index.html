<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Inteligencia Visual-Espacial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <h1>Test de Inteligencia Visual-Espacial</h1>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="counter" id="counter">
        Pregunta 1 de 10
    </div>

    <div class="card">

        <h2 id="question"></h2>

        <div id="visualArea"></div>

        <div id="answers" class="answers"></div>

        <button id="nextBtn">
            Siguiente →
        </button>

    </div>

    <div id="result" class="hidden">

        <h2>Resultado</h2>

        <p id="score"></p>

        <p id="level"></p>

        <button onclick="location.reload()">
            Repetir Test
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
