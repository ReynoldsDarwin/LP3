<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Inteligencia Naturalista</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🌿 Test de Inteligencia Naturalista</h1>

            <p>
                Descubre tu capacidad para comprender, observar y relacionarte con la naturaleza, los seres vivos y el entorno natural.
            </p>

        </div>

        <div class="progress-wrapper">

            <div class="progress-info">
                <span id="questionCounter">
                    Pregunta 1 de 20
                </span>

                <span id="progressPercent">
                    5%
                </span>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>

        <div class="quiz-card">

            <h2 id="question"></h2>

            <div id="answers" class="answers"></div>

            <button id="nextBtn">
                Siguiente →
            </button>

        </div>

        <div id="resultContainer" class="result hidden">

            <h2>🌎 Resultado Final</h2>

            <p id="scoreText"></p>

            <p id="levelText"></p>

            <button onclick="location.reload()">
                Realizar nuevamente
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
