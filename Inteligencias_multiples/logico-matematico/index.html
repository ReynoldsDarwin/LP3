<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Inteligencia Lógico-Matemática</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>Inteligencia Lógico-Matemática</h1>
            <p>Descubre tu nivel de pensamiento lógico y razonamiento matemático.</p>
        </div>

        <div class="progress-wrapper">

            <div class="progress-info">
                <span id="questionCounter">Pregunta 1 de 10</span>
                <span id="progressPercent">10%</span>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>

        <div class="quiz-card">

            <div id="questionContainer">
                <h2 id="question"></h2>
                <div id="answers" class="answers"></div>
            </div>

            <button id="nextBtn">Siguiente →</button>

        </div>

        <div id="resultContainer" class="result hidden">

            <h2>Resultado Final</h2>

            <p id="scoreText"></p>

            <p id="levelText"></p>

            <button onclick="location.reload()">
                Realizar nuevamente
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
